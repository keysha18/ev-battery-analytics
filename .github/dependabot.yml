version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directories: [/, /dbt]
    schedule:
      interval: monthly
    # La version de Python est choisie à la main (uv.lock, .python-version, compatibilité dbt) :
    # seules les mises à jour de correctif sont proposées
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Dépendances Python (uv.lock)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
