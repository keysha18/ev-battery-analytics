services:
  postgres:
    image: postgres:17
    container_name: ev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_RO_USER: ${API_RO_USER}
      API_RO_PASSWORD: ${API_RO_PASSWORD}
    ports:
      # Exposé uniquement en local, pas sur le réseau
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Exécutés une seule fois, à la création du volume
      - ./sql/00_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Outil ponctuel : make dbt-build / docker compose run --rm dbt <commande>
  dbt:
    profiles: ["tools"]
    build: ./dbt
    image: ev-battery-dbt
    # uid/gid de l'hôte pour ne pas créer de fichiers root dans ./dbt (target/, logs/)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      DBT_POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./dbt:/usr/app

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ev-battery-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      # Rôle en lecture seule : l'API n'a jamais le mot de passe administrateur
      API_RO_USER: ${API_RO_USER}
      API_RO_PASSWORD: ${API_RO_PASSWORD}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
